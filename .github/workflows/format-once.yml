name: format-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          check-latest: true
          cache: false
      - name: Format tracked Go sources
        run: gofmt -w internal/envelope/*.go
      - name: Commit formatting
        run: |
          git diff --exit-code && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/envelope/*.go
          git commit -m "style: apply gofmt to envelope sources"
          git push
